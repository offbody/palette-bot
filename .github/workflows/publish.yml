name: Publish

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "30 8 * * *"
    - cron: "0 10 * * *"
    - cron: "30 11 * * *"
    - cron: "0 13 * * *"
    - cron: "30 14 * * *"
    - cron: "0 16 * * *"
    - cron: "30 17 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Publication date in YYYY-MM-DD format. Defaults to the run date.
        required: false
        type: string
      dry_run:
        description: Check Telegram access without publishing.
        required: true
        default: true
        type: boolean
      attempts:
        description: Number of deterministic strategy attempts.
        required: true
        default: "32"
        type: string
      min_score:
        description: Minimum acceptable palette score.
        required: true
        default: "70"
        type: string
      color_count:
        description: Number of colors. Use auto for deterministic selection.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      preset:
        description: Palette preset. Use auto for deterministic selection.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - ui-soft
          - editorial-bold
          - minimal-neutral
          - brand-vivid
          - dark-interface
      harmony:
        description: Harmony mode. Use auto for a preset-compatible choice.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - analogous
          - complementary
          - triadic
          - monochrome
          - warm
          - cool
          - muted
          - vivid

jobs:
  publish:
    name: Publish Palette
    runs-on: ubuntu-latest
    timeout-minutes: 95

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JITTER_MAX_MINUTES: 70
      SCHEDULE_POSTS_PER_DAY: ${{ vars.SCHEDULE_POSTS_PER_DAY || '1' }}
      SCHEDULE_DAY_INTERVAL: ${{ vars.SCHEDULE_DAY_INTERVAL || '1' }}

    steps:
      - name: Check scheduled settings
        id: schedule_settings
        run: |
          should_publish=true
          slot=1
          active_slots="manual"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 7 * * *") slot=1 ;;
              "30 8 * * *") slot=2 ;;
              "0 10 * * *") slot=3 ;;
              "30 11 * * *") slot=4 ;;
              "0 13 * * *") slot=5 ;;
              "30 14 * * *") slot=6 ;;
              "0 16 * * *") slot=7 ;;
              "30 17 * * *") slot=8 ;;
              "0 19 * * *") slot=9 ;;
              *) slot=1 ;;
            esac

            publication_date="$(date -u +%F)"
            posts_per_day="${SCHEDULE_POSTS_PER_DAY}"
            day_interval="${SCHEDULE_DAY_INTERVAL}"

            if ! [[ "${posts_per_day}" =~ ^[0-9]+$ ]]; then
              posts_per_day=1
            fi

            if ! [[ "${day_interval}" =~ ^[0-9]+$ ]]; then
              day_interval=1
            fi

            if [ "${posts_per_day}" -lt 1 ]; then posts_per_day=1; fi
            if [ "${posts_per_day}" -gt 5 ]; then posts_per_day=5; fi
            if [ "${day_interval}" -lt 1 ]; then day_interval=1; fi
            if [ "${day_interval}" -gt 30 ]; then day_interval=30; fi

            day_index=$((($(date -u +%s) / 86400)))

            active_slots="$(for candidate_slot in 1 2 3 4 5 6 7 8 9; do
              hash="$(printf '%s' "${publication_date}:${posts_per_day}:slot:${candidate_slot}" | sha256sum | cut -c1-12)"
              printf '%s %s\n' "${hash}" "${candidate_slot}"
            done | sort | head -n "${posts_per_day}" | awk '{print $2}' | sort -n | paste -sd ',' -)"

            if [ $((day_index % day_interval)) -ne 0 ]; then
              should_publish=false
            fi

            case ",${active_slots}," in
              *",${slot},"*) ;;
              *) should_publish=false ;;
            esac
          fi

          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          echo "slot=${slot}" >> "$GITHUB_OUTPUT"
          echo "active_slots=${active_slots}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        run: pnpm run playwright:install:ci

      - name: Resolve publication date
        id: publication
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            publication_date="${{ inputs.date }}"
          else
            publication_date="$(date -u +%F)"
          fi
          echo "date=${publication_date}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "attempts=32" >> "$GITHUB_OUTPUT"
            echo "min_score=70" >> "$GITHUB_OUTPUT"
            echo "color_count=auto" >> "$GITHUB_OUTPUT"
            echo "preset=auto" >> "$GITHUB_OUTPUT"
            echo "harmony=auto" >> "$GITHUB_OUTPUT"
            echo "seed=post:${publication_date}:slot-${{ steps.schedule_settings.outputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "attempts=${{ inputs.attempts }}" >> "$GITHUB_OUTPUT"
            echo "min_score=${{ inputs.min_score }}" >> "$GITHUB_OUTPUT"
            echo "color_count=${{ inputs.color_count }}" >> "$GITHUB_OUTPUT"
            echo "preset=${{ inputs.preset }}" >> "$GITHUB_OUTPUT"
            echo "harmony=${{ inputs.harmony }}" >> "$GITHUB_OUTPUT"
            echo "seed=manual:${publication_date}:${{ github.run_id }}:${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply scheduled jitter
        if: ${{ github.event_name == 'schedule' && steps.schedule_settings.outputs.should_publish == 'true' }}
        run: |
          delay=$((0x$(printf '%s' "${{ steps.publication.outputs.date }}:${{ steps.schedule_settings.outputs.slot }}" | sha256sum | cut -c1-8) % (JITTER_MAX_MINUTES + 1)))
          echo "Scheduled jitter: ${delay} minutes"
          sleep "${delay}m"

      - name: Create publication preview
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        run: |
          args=(
            --date "${{ steps.publication.outputs.date }}"
            --seed "${{ steps.publication.outputs.seed }}"
            --attempts "${{ steps.publication.outputs.attempts }}"
            --min-score "${{ steps.publication.outputs.min_score }}"
            --plan output/post-plan.json
            --json output/post-palette.json
            --png output/post-palette.png
            --message output/post-message.txt
          )

          if [ "${{ steps.publication.outputs.preset }}" != "auto" ]; then
            args+=(--preset "${{ steps.publication.outputs.preset }}")
          fi

          if [ "${{ steps.publication.outputs.color_count }}" != "auto" ]; then
            args+=(--colors "${{ steps.publication.outputs.color_count }}")
          fi

          if [ "${{ steps.publication.outputs.harmony }}" != "auto" ]; then
            args+=(--harmony "${{ steps.publication.outputs.harmony }}")
          fi

          pnpm run publish:preview -- "${args[@]}"

      - name: Check generated files
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        run: |
          pnpm run check:png -- output/post-palette.png
          pnpm run check:message -- output/post-message.txt

      - name: Telegram dry-run
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' && steps.publication.outputs.dry_run == 'true' }}
        run: >
          pnpm run publish:telegram:dry-run --
          --photo output/post-palette.png
          --message output/post-message.txt

      - name: Publish to Telegram
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' && steps.publication.outputs.dry_run != 'true' }}
        run: >
          pnpm run publish:telegram --
          --photo output/post-palette.png
          --message output/post-message.txt

      - name: Upload generated artifacts
        if: ${{ steps.schedule_settings.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ steps.publication.outputs.date }}
          path: |
            output/post-plan.json
            output/post-palette.json
            output/post-palette.png
            output/post-message.txt
