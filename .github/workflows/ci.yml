name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  renderer:
    name: Renderer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm run playwright:install:ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test palette generator
        run: pnpm run test:generator

      - name: Render generated palette
        run: pnpm run test:generated-render

      - name: Render fixture palettes
        run: pnpm run test:render
